[server]
# Las facturas se limitan a 10 MB
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
# La app está diseñada en claro: se usa siempre el tema claro para que todo se lea bien.
base = "light"
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
chartCategoricalColors = ["#10b981", "#3b82f6", "#f97316", "#a855f7", "#f43f5e", "#06b6d4", "#eab308", "#64748b"]
primaryColor = "#059669"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5fb"
textColor = "#0f172a"
borderColor = "#a3b1c6"
greenColor = "#059669"
orangeColor = "#ea580c"
redColor = "#e11d48"
blueColor = "#2563eb"

[theme.sidebar]
backgroundColor = "#f7f8fc"
